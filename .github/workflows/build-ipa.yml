name: Build iOS IPA (Unsigned for Sideloading)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile & Package IPA
    runs-on: macos-15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚙️ Generate iOS Native Workspace (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 Install CocoaPods Dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: 🔨 Build iOS App (Unsigned for Sideloading)
        run: |
          xcodebuild -workspace ios/GalaxyBudsCompanion.xcworkspace \
                     -scheme GalaxyBudsCompanion \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/GalaxyBudsCompanion.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     archive

      - name: 📦 Package .app into .ipa for Sideloadly / AltStore
        run: |
          mkdir -p build/Payload
          cp -r build/GalaxyBudsCompanion.xcarchive/Products/Applications/GalaxyBudsCompanion.app build/Payload/
          cd build && zip -qr GalaxyBudsCompanion.ipa Payload

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyBudsCompanion-ipa
          path: build/GalaxyBudsCompanion.ipa
          retention-days: 14

